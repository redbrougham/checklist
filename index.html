<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Checklist">
<meta name="theme-color" content="#171614">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Checklist</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --bg:#f7f6f2;--surf:#f9f8f5;--surf2:#fbfbf9;--surfoff:#f3f0ec;--surfdyn:#e6e4df;
  --div:#dcd9d5;--bdr:#d4d1ca;--txt:#28251d;--muted:#7a7974;--faint:#bab9b4;
  --pri:#01696f;--pri-h:#0c4e54;--pri-a:#0f3638;
  --err:#a12c7b;--warn:#964219;--ok:#437a22;
  --sh-sm:0 1px 2px oklch(0.2 0.01 80/0.06);--sh-md:0 4px 12px oklch(0.2 0.01 80/0.08);
  --r-sm:.375rem;--r-md:.5rem;--r-lg:.75rem;--r-xl:1rem;--r-full:9999px;
  --tr:180ms cubic-bezier(0.16,1,0.3,1);
  --font:'Satoshi','Helvetica Neue',sans-serif;
  --xs:clamp(.75rem,.7rem + .25vw,.875rem);--sm:clamp(.875rem,.8rem + .35vw,1rem);
  --base:clamp(1rem,.95rem + .25vw,1.125rem);--lg:clamp(1.125rem,1rem + .75vw,1.5rem);--xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --sp1:.25rem;--sp2:.5rem;--sp3:.75rem;--sp4:1rem;--sp5:1.25rem;--sp6:1.5rem;--sp8:2rem;
}
[data-theme="dark"]{
  --bg:#171614;--surf:#1c1b19;--surf2:#201f1d;--surfoff:#242320;--surfdyn:#2d2c2a;
  --div:#262523;--bdr:#393836;--txt:#cdccca;--muted:#797876;--faint:#5a5957;
  --pri:#4f98a3;--pri-h:#227f8b;--pri-a:#1a626b;
  --err:#d163a7;--warn:#bb653b;--ok:#6daa45;
  --sh-sm:0 1px 2px oklch(0 0 0/.2);--sh-md:0 4px 12px oklch(0 0 0/.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;height:100%}
body{min-height:100dvh;font-family:var(--font);font-size:var(--base);color:var(--txt);background:var(--bg);line-height:1.6;transition:background var(--tr),color var(--tr);padding-bottom:env(safe-area-inset-bottom)}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:3px;border-radius:var(--r-sm)}

.app{max-width:680px;margin:0 auto;padding:var(--sp8) var(--sp4);padding-top:max(var(--sp8),env(safe-area-inset-top,0px) + var(--sp4))}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp8)}
.logo{display:flex;align-items:center;gap:var(--sp3)}
.logo svg{color:var(--pri);flex-shrink:0}
.logo-text{font-size:var(--xl);font-weight:700;letter-spacing:-.02em}
#theme-toggle{padding:var(--sp2);border-radius:var(--r-md);color:var(--muted);transition:background var(--tr),color var(--tr)}
#theme-toggle:hover{background:var(--surfoff);color:var(--txt)}

/* PROGRESS */
.prog-label{font-size:var(--xs);color:var(--muted);text-align:right;margin-bottom:var(--sp2)}
.prog-wrap{background:var(--surfoff);border-radius:var(--r-full);height:6px;margin-bottom:var(--sp6);overflow:hidden}
.prog-fill{height:100%;background:var(--pri);border-radius:var(--r-full);transition:width .4s cubic-bezier(0.16,1,0.3,1)}

/* ADD FORM */
.add-form{display:flex;gap:var(--sp2);margin-bottom:var(--sp4)}
.add-input{flex:1;background:var(--surf);border:1px solid oklch(from var(--txt) l c h/.14);border-radius:var(--r-md);padding:var(--sp3) var(--sp4);font-size:var(--sm);color:var(--txt);transition:border-color var(--tr),background var(--tr);-webkit-appearance:none}
.add-input::placeholder{color:var(--faint)}
.add-input:focus{outline:none;border-color:var(--pri);background:var(--surf2)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:var(--sp2);padding:var(--sp3) var(--sp4);border-radius:var(--r-md);font-size:var(--sm);font-weight:600;transition:background var(--tr),color var(--tr);white-space:nowrap;min-height:44px}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:hover{background:var(--pri-h)}
.btn-pri:active{background:var(--pri-a);transform:scale(.98)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid oklch(from var(--txt) l c h/.12)}
.btn-ghost:hover{background:var(--surfoff);color:var(--txt)}
.btn-warn{display:inline-flex;align-items:center;gap:var(--sp2);padding:var(--sp2) var(--sp4);border-radius:var(--r-md);font-size:var(--sm);font-weight:500;color:var(--warn);border:1px solid oklch(from var(--warn) l c h/.3);background:transparent;transition:background var(--tr);white-space:nowrap;min-height:44px}
.btn-warn:hover{background:oklch(from var(--warn) l c h/.08)}
.btn-icon{padding:var(--sp2);border-radius:var(--r-sm);color:var(--faint);transition:background var(--tr),color var(--tr);min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center}
.btn-icon:hover{background:oklch(from var(--err) l c h/.1);color:var(--err)}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp3);margin-bottom:var(--sp5);flex-wrap:wrap}

/* LIST */
.items-list{display:flex;flex-direction:column;gap:var(--sp2)}
.item-card{background:var(--surf);border:1px solid oklch(from var(--txt) l c h/.08);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm);transition:box-shadow var(--tr)}
.item-card:hover{box-shadow:var(--sh-md)}
.item-card.done{opacity:.6}

.item-hdr{display:flex;align-items:center;gap:var(--sp3);padding:var(--sp3) var(--sp4);min-height:54px;cursor:pointer;user-select:none;transition:background var(--tr);-webkit-tap-highlight-color:transparent}
.item-hdr:active{background:var(--surfoff)}

.cb{width:24px;height:24px;border-radius:var(--r-sm);border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background var(--tr),border-color var(--tr);min-width:24px}
.cb:hover{border-color:var(--pri)}
.cb.on{background:var(--pri);border-color:var(--pri)}
.cb svg{opacity:0;transform:scale(.5);transition:opacity var(--tr),transform var(--tr);color:#fff}
.cb.on svg{opacity:1;transform:scale(1)}

.title-wrap{flex:1;min-width:0}
.item-title{font-size:var(--base);font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color var(--tr)}
.item-card.done .item-title{text-decoration:line-through;color:var(--muted)}
.note-preview{font-size:var(--xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

.item-right{display:flex;align-items:center;gap:var(--sp1);flex-shrink:0}
.expand-icon{color:var(--faint);transition:transform var(--tr),color var(--tr);flex-shrink:0}
.item-card.open .expand-icon{transform:rotate(180deg);color:var(--pri)}

/* NOTES */
.notes-panel{display:none;padding:var(--sp3) var(--sp4) var(--sp4);border-top:1px solid oklch(from var(--txt) l c h/.07);background:var(--surf2);animation:slideDown .18s ease}
.item-card.open .notes-panel{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.notes-lbl{font-size:var(--xs);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:var(--sp2)}
.notes-ta{width:100%;min-height:90px;background:var(--surfoff);border:1px solid oklch(from var(--txt) l c h/.1);border-radius:var(--r-md);padding:var(--sp3);font-size:var(--sm);color:var(--txt);resize:vertical;line-height:1.6;transition:border-color var(--tr),background var(--tr);-webkit-appearance:none}
.notes-ta::placeholder{color:var(--faint)}
.notes-ta:focus{outline:none;border-color:var(--pri);background:var(--surf)}

/* EMPTY */
.empty{text-align:center;padding:4rem var(--sp8);color:var(--muted)}
.empty svg{margin:0 auto var(--sp4);color:var(--faint)}
.empty h3{font-size:var(--lg);color:var(--txt);margin-bottom:var(--sp2)}
.empty p{font-size:var(--sm);max-width:30ch;margin:0 auto}

/* TOAST */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--surfdyn);color:var(--txt);padding:var(--sp3) var(--sp5);border-radius:var(--r-full);font-size:var(--sm);font-weight:500;box-shadow:var(--sh-md);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:480px){
  .logo-text{font-size:var(--lg)}
  .toolbar{gap:var(--sp2)}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="24" height="24" rx="6" stroke="currentColor" stroke-width="2"/>
        <path d="M8 14l4 4 8-8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logo-text">Checklist</span>
    </div>
    <button id="theme-toggle" aria-label="Toggle theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <div class="prog-label" id="prog-label">No items yet</div>
  <div class="prog-wrap"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>

  <div class="add-form">
    <input class="add-input" id="add-input" type="text" placeholder="New item title..." maxlength="120" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="btn btn-pri" id="add-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add
    </button>
  </div>

  <div class="toolbar">
    <button class="btn-warn" id="reset-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.81"/></svg>
      Reset All
    </button>
    <span id="save-indicator" style="font-size:var(--xs);color:var(--faint)"></span>
  </div>

  <div class="items-list" id="items-list"></div>

  <div class="empty" id="empty">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="3" y="3" width="18" height="18" rx="4"/>
      <path d="M9 12l2 2 4-4"/>
    </svg>
    <h3>Nothing here yet</h3>
    <p>Type a title above and tap Add.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var STORAGE_KEY = 'checklist_data_v1';
var items = [];
var nextId = 1;
var saveTimer = null;

function load() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var data = JSON.parse(raw);
      items = data.items || [];
      nextId = data.nextId || (items.length ? Math.max.apply(null, items.map(function(i){return i.id;})) + 1 : 1);
    }
  } catch(e) { items = []; nextId = 1; }
}

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ items: items, nextId: nextId }));
      var ind = document.getElementById('save-indicator');
      if (ind) { ind.textContent = 'Saved'; setTimeout(function(){ ind.textContent = ''; }, 1500); }
    } catch(e) {}
  }, 400);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  var list = document.getElementById('items-list');
  var empty = document.getElementById('empty');
  var fill = document.getElementById('prog-fill');
  var label = document.getElementById('prog-label');
  var done = items.filter(function(i){return i.done;}).length;
  var total = items.length;
  fill.style.width = total ? (done/total*100)+'%' : '0%';
  label.textContent = total ? done+' of '+total+' done' : 'No items yet';
  empty.style.display = total ? 'none' : 'block';
  if (!total) { list.innerHTML = ''; return; }

  var html = '';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    html += '<div class="item-card'+(it.done?' done':'')+(it.open?' open':'')+'" id="c'+it.id+'">';
    html += '<div class="item-hdr" data-hdr="'+it.id+'">';
    html += '<div class="cb'+(it.done?' on':'')+'" data-cb="'+it.id+'" role="checkbox" aria-checked="'+it.done+'" tabindex="0">';
    html += '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>';
    html += '<div class="title-wrap"><div class="item-title">'+esc(it.title)+'</div>';
    if (it.notes) html += '<div class="note-preview">'+esc(it.notes)+'</div>';
    html += '</div>';
    html += '<div class="item-right">';
    html += '<button class="btn-icon" data-del="'+it.id+'" aria-label="Delete" title="Delete item">';
    html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>';
    html += '<svg class="expand-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';
    html += '</div></div>';
    html += '<div class="notes-panel"><div class="notes-lbl">Notes</div>';
    html += '<textarea class="notes-ta" data-notes="'+it.id+'" placeholder="Notes, details, reminders...">'+esc(it.notes)+'</textarea>';
    html += '</div></div>';
  }
  list.innerHTML = html;
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

document.getElementById('items-list').addEventListener('click', function(e) {
  var cb = e.target.closest('[data-cb]');
  if (cb) {
    var id = +cb.getAttribute('data-cb');
    var it = items.find(function(x){return x.id===id;});
    if (it) { it.done = !it.done; render(); save(); } return;
  }
  var del = e.target.closest('[data-del]');
  if (del) {
    var id = +del.getAttribute('data-del');
    items = items.filter(function(x){return x.id!==id;});
    render(); save(); return;
  }
  var hdr = e.target.closest('[data-hdr]');
  if (hdr) {
    var id = +hdr.getAttribute('data-hdr');
    var it = items.find(function(x){return x.id===id;});
    if (it) { it.open = !it.open; render(); } return;
  }
});

document.getElementById('items-list').addEventListener('keydown', function(e) {
  var cb = e.target.closest('[data-cb]');
  if (cb && (e.key==='Enter'||e.key===' ')) {
    e.preventDefault();
    var id = +cb.getAttribute('data-cb');
    var it = items.find(function(x){return x.id===id;});
    if (it) { it.done = !it.done; render(); save(); }
  }
});

document.getElementById('items-list').addEventListener('input', function(e) {
  var ta = e.target.closest('[data-notes]');
  if (ta) {
    var id = +ta.getAttribute('data-notes');
    var it = items.find(function(x){return x.id===id;});
    if (it) {
      it.notes = ta.value;
      var card = document.getElementById('c'+id);
      if (card) {
        var wrap = card.querySelector('.title-wrap');
        var prev = wrap.querySelector('.note-preview');
        if (ta.value.trim()) {
          if (!prev) { prev = document.createElement('div'); prev.className = 'note-preview'; wrap.appendChild(prev); }
          prev.textContent = ta.value;
        } else if (prev) prev.remove();
      }
      save();
    }
  }
});

function addItem() {
  var inp = document.getElementById('add-input');
  var val = inp.value.trim();
  if (!val) { inp.focus(); return; }
  items.push({ id: nextId++, title: val, done: false, notes: '', open: false });
  inp.value = ''; inp.focus();
  render(); save();
}

document.getElementById('add-btn').addEventListener('click', addItem);
document.getElementById('add-input').addEventListener('keydown', function(e){
  if (e.key==='Enter') addItem();
});

document.getElementById('reset-btn').addEventListener('click', function(){
  var c = items.filter(function(i){return i.done;}).length;
  if (!c) { toast('Nothing is checked yet'); return; }
  items.forEach(function(i){i.done=false;});
  render(); save(); toast('All ' + c + ' items reset');
});

// THEME
(function(){
  var btn = document.getElementById('theme-toggle'), root = document.documentElement;
  var t = localStorage.getItem('cl_theme') || 'dark';
  function set(v) {
    t = v; root.setAttribute('data-theme', v);
    try { localStorage.setItem('cl_theme', v); } catch(e){}
    btn.innerHTML = v==='dark'
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    btn.setAttribute('aria-label','Switch to '+(v==='dark'?'light':'dark')+' mode');
  }
  set(t);
  btn.addEventListener('click', function(){ set(t==='dark'?'light':'dark'); });
})();

// SERVICE WORKER
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

load();
render();
</script>
</body>
</html>
